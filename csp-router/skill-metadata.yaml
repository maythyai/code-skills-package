      wiki/spec 各存各的 .meta.json: "废弃侧车。元数据内联进 .md 顶部 YAML frontmatter，每页自包含。"
      生成 Python 代码操作知识: "禁止。用 hub_manifest.sh 脚本（纯 git+grep，零依赖），比生成代码快 10x 且可复现。"
      写知识前不查冲突: "禁止。add 前必先 search 现有页；命中冲突自动 update，不问'删旧的?'。"
