      知识直接散在 docs/ 就行: "散落文档无索引、无 manifest、无路由 → Agent 找不到、对不齐。hub 用 manifest + AGENTS.md 让 spec 可定位、可追溯、可增量。"
      用平台知识库存就行: "平台耦合（鉴权/域名/专有 API）不可本地复现、不可离线、不可 git 治理。本 hub 全本地 markdown+git，可离线、可审计、可 PR。"
