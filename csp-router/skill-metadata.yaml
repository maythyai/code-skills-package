      不写 capability contract，直接把 PRD 丢给开发: "PRD 只说做什么，不说实现前必须成立哪些约束/不变量。丢给开发 = 把隐藏假设留给工程师猜，跨服务/跨团队时必出问题。"
      一次性全量调研再启动: "调研是持续活动不是前置 gate。按 MVP 范围做够支撑决策的最小调研，剩余在迭代中补。"
