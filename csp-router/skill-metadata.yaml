      alembic current==head 所以没问题: "迁移工具只说 stamp 存在——不代表 DDL 真的执行了。已 applied 的迁移中插入增量列是最常见的漂移根因。"
      之前能跑现在也能跑: "回溯补交的迁移插入已 applied 链 = 新库有列、旧库没有 = 漂移。迁移链完整性 ≠ 物理 schema 一致性。"
