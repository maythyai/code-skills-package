      这个用户经常乱报，先放着: "报告者信誉不是定级依据。定级只看严重度 × 影响面两个客观轴；历史'乱报'用户报出的 P0 事故并不罕见。可以先补信息，不能不处理。"
      无法复现，直接关掉: "关掉不消灭问题，只消灭证据。同类问题会反复上报且每次都从零开始。正确动作是标记待观察 + 加日志/埋点 + 设复现窗口期，到期再判。"
      先修好再补单: "无单追踪 = 丢失根因记录、影响面证据与修复关联，下次同类问题无法判重，季度缺陷统计也少一笔。修复再急，先建单后动手，30 秒的事。"
      标题差不多就是重复单: "同一报错信息可能来自完全不同的根因（同一条超时日志，一个是连接池耗尽，一个是下游服务挂了）。判重必须多信号：指纹 + 触发路径 + 版本 + 用户群 + 时间窗。"
      P0 太多处理不过来，先降几个级: "降级解决不了容量问题，只让 SLA 失真。P0 数量异常本身是趋势告警信号，应该触发激增处置（暂停发布/专项），而不是改定义。"
