      - csp-deep-research
      - csp-literature-review
      - csp-tech-diagram
      - csp-article-writing
      - csp-prd-generation
    anti_rationalizations:
      这个功能我们已经上线了，没法申请了: 公开使用是否构成现有技术取决于公开时间、公开地域与公开方式，是需要专业判断的法律问题；发明人无权也不应自行放弃，如实写出首次公开时间交给代理人判断
      先把代码贴进去，代理人会看懂: "代码是实现产物不是技术方案描述。代理人需要的是步骤、判定条件、数据流与原理；贴 2000 行代码只会让代理人反推不出必要技术特征"
      效果很好，写「显著提升」就行了: "不可验证的效果描述会被要求补正，且无法支撑创造性论证。必须给出对照条件、指标口径与数值（如 P99 从 820ms 降到 210ms，同一压测脚本）"
      权利要求写窄一点更容易授权: 过窄的权利要求授权后没有保护价值——竞品改一个非必要特征就绕开了。宽窄是代理人基于检索结果做的权衡，交底书要做的是把特征分层与「可有可无」判断交出去
      检索不到相关现有技术，说明我们很创新: "检索不到 ≠ 不存在。多数免费库有 18 个月公开延迟，且检索式覆盖不足会漏检。检索结论只能写「在本轮检索范围内未发现」"
      一个交底书把这个项目所有功能都写进去更省事: 一份交底书混入多个发明构思，会导致每个构思都写不透，代理人只能挑一个或强行合并，最终两件都弱。按发明构思拆分
      这个方案是常规做法，不值得交底: 是否常规由检索与代理人判断。发明人常见误判是把自己反复打磨到能跑的方案当成显然；如实描述「难在哪」比自我审查更有价值
  csp-plan-phase:
