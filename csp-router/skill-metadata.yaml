  csp-test:
    phase: verify
    domain: patterns
    role: specialist
    scope: testing
    tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash
    dependencies:
      skills: []
    related_skills: []
    anti_rationalizations:
      We don't have time for user testing: "Mode B heuristic review can run in hours, not weeks."
      We can't find users right now: "Mode B works without users — code review + Nielsen heuristics."
      Let's just do a quick walkthrough: "A walkthrough catches ~30% of issues; Mode B catches ~60-75%."
      The design is too early to test: "Mode B works on raw code — no prototype needed."
  csp-test-case-design:
    phase: verify
    domain: testing
    role: specialist
    scope: testing
    tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash
    related_skills:
      - csp-test-methodology
      - csp-verification
      - csp-cross-layer-testing
      - csp-qa-test-engineering
      - csp-test-spec
      - csp-e2e-testing
    anti_rationalizations:
      正常流程跑通了，用例就够了: "只覆盖 happy path 的用例集对变更风险零信息量——每个输入维度至少要有 on/off/by-1 三点，每个无效等价类至少一条独立用例"
      边界值就是测 min 和 max: "只测边界本身不测边界外一步，等于没测校验逻辑；on point + off point + in point 三点缺一不可"
      条件太多，挑几个组合测测: 多条件组合必须先建判定表再合并规则，否则你挑的组合大概率重复覆盖同一分支、同时漏掉整条规则
      全组合跑不完，算了: "跑不完就用 pairwise 把组合压到 5–15%，不是放弃覆盖；压完还要手工加回高风险组合"
      用例写了一堆，AC 对不对得上不重要: "双向追溯是硬要求：孤儿用例说明在测没人要的东西，未覆盖 AC 说明有一个未经验证的声明"
      这个状态不可能出现，不用测: 不可能的迁移恰恰要测——断言它被拒绝且状态不变，否则状态机被非法事件打穿时无人发现
      时间不够，随便砍一批: "裁剪必须按固定顺序砍且留记录，绝不砍 P0、绝不砍每个无效类的代表用例、绝不让任何 AC 掉到零用例"
