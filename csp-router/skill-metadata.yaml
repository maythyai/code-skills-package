      任务拆解太细浪费时间: "粗粒度的任务 = 模糊的估时 = 不可预测的交付。每任务 ≤ 4h 是确保可预测性的最小粒度。"
      直接按模块分就行: "模块划分 ≠ 开发任务。同一模块内可能有依赖关系，需要进一步拆解并排定顺序。"
      估时不准，拆了也没用: "估时不准是常态，但拆解本身暴露了依赖和并行机会。即使估时偏 50%，拆解仍比不拆有价值。"
