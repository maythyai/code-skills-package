      按数据库表建模型就行: "数据库建模 ≠ 领域建模。数据驱动设计导致贫血模型，业务逻辑散落在 Service 层。"
      限界上下文就是微服务: 限界上下文是逻辑边界，不一定是物理边界。一个微服务可以包含多个限界上下文，反之亦然。
