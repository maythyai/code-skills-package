      DB 是后端的事，前端测试不碰库: "联动测试的核心就是把 DB 状态纳入同一断言集，否则无法发现'接口成功但落库错/界面读旧数据'的缺陷"
      用例写了但没对齐 trace_id: 没有对齐键的跨层证据无法证明因果，只能证明'各自都发生了'，等价于没联动
