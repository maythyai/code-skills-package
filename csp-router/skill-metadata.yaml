      绿测试 = 覆盖了需求: "绿测试可能没映射需求。需求可追溯缺口分析才是覆盖真相；未映射需求 = 潜在功能缺失。"
      TMS 和 PMS 无关: "TMS 是 PMS 的分支：测试面继承 PMS 模块边界与验收形态，不得发明 PMS 未声明的模块。"
      用例随便列就行: "用例矩阵式组织（入口×状态），命名完整叙事句；割裂测试（只测功能点不测联动）是漏 bug 主因。"
