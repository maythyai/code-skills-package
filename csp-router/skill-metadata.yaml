      OpenAPI 就是契约: "OpenAPI 描述的是 provider 想暴露什么，契约描述的是 consumer 实际用什么；两者的差集正是线上事故来源"
      我们服务少不需要: "只要有两个独立部署的服务 + 一个共享 API，契约漂移就是时间问题；越早建 broker 越便宜"
