      这期没什么进展，写短点: 没进展本身就是最重要的信息。写清卡在哪一步、卡在谁那里、需要什么才能动——这比一段进展描述更有决策价值
      风险还没确认，先不写，等确认了再报: 未确认的风险正是要上报以求资源去确认的。等确认完再报，通常已经变成事故报告了
      这个数字不好看，换一个指标: 口径漂移会让报告失去纵向可比性，等于每期都在重新开始。要换口径必须显式声明并给出新旧口径的换算
      把提交数列出来能体现工作量: "提交数是活动量不是成果。读者无法从 187 个提交推断出任何决策，只会得出「这人很忙」"
      风险那栏写「暂无」比较稳妥: 「暂无」不是结论是失职。连续两期「暂无」的团队通常只是没在找——按主动挖风险的五个信号源过一遍再写
      决策项写「请领导指示」最安全: "只抛问题不给选项等于把分析工作推给读者。必须给 2–3 个方案、各自代价、你的建议与理由、不决策的后果、截止时间"
      上期的内容改改日期就能发: 读者会对比上期。复制粘贴会让「上期计划本期交代」这条规则失效，计划随即退化成许愿
      四个受众写四份太累，发同一份: 同一份底层事实，四种裁剪。发同一份的结果是高管看不完、跨团队找不到与自己相关的部分、团队内部拿不到任务粒度
